<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Álbum Mundial 2026 Panini</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700; --gold2: #FFA500; --dark: #0a0a1a; --card: #13132a;
    --card2: #1a1a35; --green: #00e676; --red: #ff1744; --blue: #2979ff;
    --text: #e8e8f0; --muted: #8888aa; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark); color: var(--text);
    font-family: 'Nunito', sans-serif; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(255,215,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(41,121,255,0.08) 0%, transparent 60%);
  }
  header {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a35 50%, #0a0a1a 100%);
    border-bottom: 3px solid var(--gold); padding: 18px 20px 14px;
    text-align: center; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 30px rgba(255,215,0,0.15);
  }
  header h1 {
    font-family: 'Bebas Neue', cursive; font-size: clamp(1.8rem, 6vw, 3rem);
    background: linear-gradient(90deg, var(--gold), #fff, var(--gold2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px; line-height: 1;
  }
  header p { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .sync-status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.72rem; margin-top: 4px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.2);
    color: var(--green);
  }
  .sync-status.offline { background: rgba(255,23,68,0.1); border-color: rgba(255,23,68,0.2); color: var(--red); }
  .sync-status.syncing { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.2); color: var(--gold); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .stats-bar {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 14px 16px; background: var(--card);
    border-bottom: 1px solid rgba(255,215,0,0.12);
  }
  .stat-pill {
    background: var(--card2); border: 1px solid rgba(255,215,0,0.2);
    border-radius: 999px; padding: 6px 16px; font-size: 0.82rem;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-pill span { font-weight: 900; font-size: 1rem; }
  .s-total { color: var(--gold); } .s-have { color: var(--green); }
  .s-miss { color: var(--red); } .s-pct { color: var(--blue); }
  .controls {
    padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px;
    background: var(--dark); border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--card); border: 1.5px solid rgba(255,215,0,0.25);
    border-radius: 999px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; padding: 9px 16px 9px 38px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.5; }
  .filter-btn {
    background: var(--card); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 999px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 0.82rem; font-weight: 700; padding: 8px 16px; cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  .countries {
    padding: 16px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
  }
  .country-card {
    background: var(--card); border-radius: var(--radius);
    border: 1.5px solid rgba(255,255,255,0.07); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
  }
  .country-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .country-card.complete { border-color: rgba(0,230,118,0.4); }
  .country-card.hidden { display: none; }
  .country-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: var(--card2); cursor: pointer; user-select: none;
  }
  .country-header:hover { background: rgba(255,215,0,0.06); }
  .country-left { display: flex; align-items: center; gap: 10px; }
  .country-flag { font-size: 1.6rem; line-height: 1; }
  .country-info h3 { font-size: 0.95rem; font-weight: 900; letter-spacing: 0.5px; }
  .country-info .c-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .country-right { display: flex; align-items: center; gap: 8px; }
  .mini-bar-wrap { width: 60px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .mini-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), #00bcd4); transition: width 0.5s; }
  .c-count { font-size: 0.78rem; font-weight: 700; color: var(--gold); min-width: 36px; text-align: right; }
  .toggle-arrow { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
  .country-card.open .toggle-arrow { transform: rotate(180deg); }
  .stickers-panel {
    display: none; padding: 12px;
    grid-template-columns: repeat(5, 1fr); gap: 8px;
  }
  .country-card.open .stickers-panel { display: grid; }
  .sticker {
    background: var(--card2); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer;
    transition: all 0.15s; position: relative; min-height: 72px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .sticker:hover { transform: scale(1.06); border-color: var(--gold); }
  .sticker.have { background: rgba(0,230,118,0.12); border-color: rgba(0,230,118,0.5); }
  .sticker.repeated { background: rgba(255,152,0,0.12); border-color: rgba(255,152,0,0.5); }
  .sticker-num { font-size: 0.65rem; color: var(--muted); font-weight: 700; }
  .sticker-name {
    font-size: 0.58rem; color: var(--text); font-weight: 600;
    line-height: 1.2; text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sticker-icon { font-size: 1.1rem; }
  .sticker-badge {
    position: absolute; top: -5px; right: -5px; background: var(--gold2); color: #000;
    border-radius: 999px; font-size: 0.55rem; font-weight: 900;
    min-width: 16px; height: 16px; display: none; align-items: center; justify-content: center;
  }
  .sticker.repeated .sticker-badge { display: flex; }
  .sticker-actions { display: flex; gap: 4px; margin-top: 2px; }
  .sticker-actions button {
    background: transparent; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: var(--muted); font-size: 0.6rem;
    padding: 2px 5px; cursor: pointer; transition: all 0.15s; font-family: 'Nunito'; font-weight: 700;
  }
  .legend {
    display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 16px;
    font-size: 0.75rem; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.05);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 4px; }
  .ld-have { background: rgba(0,230,118,0.5); border: 1px solid var(--green); }
  .ld-rep { background: rgba(255,152,0,0.5); border: 1px solid var(--gold2); }
  .ld-miss { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 2px solid var(--gold); border-radius: 18px;
    padding: 24px 20px; width: 90%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal h3 { font-family: 'Bebas Neue'; font-size: 1.3rem; color: var(--gold); margin-bottom: 14px; }
  .modal label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal input {
    width: 100%; background: var(--card2); border: 1.5px solid rgba(255,215,0,0.3);
    border-radius: 10px; color: var(--text); font-family: 'Nunito'; font-size: 0.9rem;
    padding: 9px 12px; outline: none; margin-bottom: 14px;
  }
  .modal input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; padding: 10px; border-radius: 10px; border: none;
    font-family: 'Nunito'; font-weight: 900; font-size: 0.9rem; cursor: pointer;
  }
  .btn-save { background: var(--gold); color: #000; }
  .btn-cancel { background: var(--card2); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--gold); border-radius: 999px;
    padding: 10px 20px; font-size: 0.85rem; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 300; opacity: 0;
    transition: opacity 0.3s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .loading-screen {
    position: fixed; inset: 0; background: var(--dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 500; gap: 16px;
  }
  .loading-screen h2 { font-family: 'Bebas Neue'; font-size: 2rem; color: var(--gold); }
  .loading-screen p { color: var(--muted); font-size: 0.9rem; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,215,0,0.2);
    border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .export-bar {
    padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,215,0,0.12); background: var(--card);
  }
  .export-bar button {
    background: var(--card2); border: 1.5px solid rgba(255,215,0,0.25);
    border-radius: 999px; color: var(--text); font-family: 'Nunito'; font-weight: 700;
    font-size: 0.8rem; padding: 8px 16px; cursor: pointer; transition: all 0.2s;
  }
  .export-bar button:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  @media (max-width: 480px) {
    .countries { grid-template-columns: 1fr; }
    .stickers-panel { grid-template-columns: repeat(4, 1fr); }
  }
</style>

];

const STICKERS_PER = 20;
let albumData = {};
let activeFilter = 'all';
let editTarget = null;

// ===== SYNC STATUS =====
function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  const tx = document.getElementById('syncText');
  el.className = 'sync-status ' + state;
  tx.textContent = text;
}

// ===== INIT DATA =====
function initEmpty() {
  albumData = {};
  COUNTRIES.forEach(c => {
    albumData[c.id] = {};
    for (let i = 1; i <= STICKERS_PER; i++) {
      albumData[c.id][i] = { state: 0, name: '' };
    }
  });
}

function ensureData() {
  COUNTRIES.forEach(c => {
    if (!albumData[c.id]) albumData[c.id] = {};
    for (let i = 1; i <= STICKERS_PER; i++) {
      if (!albumData[c.id][i]) albumData[c.id][i] = { state: 0, name: '' };
    }
  });
}

// ===== FIREBASE LOAD =====
async function loadFromFirebase() {
  try {
    const snapshot = await get(ref(db, 'album'));
    if (snapshot.exists()) {
      albumData = snapshot.val();
      ensureData();
    } else {
      initEmpty();
      await set(ref(db, 'album'), albumData);
    }
    setSyncStatus('online', '🔥 Firebase conectado');
    document.getElementById('loadingScreen').style.display = 'none';
    renderAll();

    // Escuchar cambios en tiempo real
    onValue(ref(db, 'album'), (snap) => {
      if (snap.exists()) {
        albumData = snap.val();
        ensureData();
        renderAll();
      }
    });
  } catch(e) {
    setSyncStatus('offline', '❌ Sin conexión');
    document.getElementById('loadingScreen').style.display = 'none';
    initEmpty();
    renderAll();
    showToast('⚠️ Sin conexión a Firebase. Modo offline.');
  }
}

// ===== SAVE TO FIREBASE =====
async function saveSticker(cid, num) {
  try {
    setSyncStatus('syncing', '⏳ Guardando...');
    await set(ref(db, `album/${cid}/${num}`), albumData[cid][num]);
    setSyncStatus('online', '✅ Guardado en Firebase');
  } catch(e) {
    setSyncStatus('offline', '❌ Error al guardar');
    showToast('❌ Error al guardar. Revisa tu conexión.');
  }
}

// ===== STATS =====
function getCountryStats(cid) {
  let have = 0, repeated = 0;
  for (let i = 1; i <= STICKERS_PER; i++) {
    const s = albumData[cid]?.[i]?.state ?? 0;
    if (s === 1) have++;
    else if (s === 2) repeated++;
  }
  return { have, repeated };
}

function updateStats() {
  let have = 0, repeated = 0;
  const total = COUNTRIES.length * STICKERS_PER;
  COUNTRIES.forEach(c => {
    const s = getCountryStats(c.id);
    have += s.have; repeated += s.repeated;
  });
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sHave').textContent = have;
  document.getElementById('sMiss').textContent = total - have;
  document.getElementById('sRep').textContent = repeated;
  document.getElementById('sPct').textContent = Math.round((have / total) * 100) + '%';
}

// ===== RENDER =====
function renderAll() {
  const grid = document.getElementById('countriesGrid');
  grid.innerHTML = COUNTRIES.map(renderCountry).join('');
  applyFilter();
  updateStats();
}

function renderCountry(c) {
  const stats = getCountryStats(c.id);
  const pct = Math.round((stats.have / STICKERS_PER) * 100);
  const isComplete = stats.have === STICKERS_PER;
  let stk = '';
  for (let i = 1; i <= STICKERS_PER; i++) stk += renderSticker(c.id, i);
  return `
    <div class="country-card ${isComplete ? 'complete' : ''}" id="cc-${c.id}">
      <div class="country-header" onclick="toggleCountry('${c.id}')">
        <div class="country-left">
          <span class="country-flag">${c.flag}</span>
          <div class="country-info">
            <h3>${c.name}</h3>
            <div class="c-sub">Grupo ${c.group} · ${stats.have}/${STICKERS_PER}${stats.repeated > 0 ? ' · ' + stats.repeated + ' rep.' : ''}</div>
          </div>
        </div>
        <div class="country-right">
          <div class="mini-bar-wrap"><div class="mini-bar" style="width:${pct}%"></div></div>
          <div class="c-count">${pct}%</div>
          <span class="toggle-arrow">▼</span>
        </div>
      </div>
      <div class="stickers-panel" id="sp-${c.id}">${stk}</div>
    </div>`;
}

function renderSticker(cid, num) {
  const d = albumData[cid]?.[num] ?? { state: 0, name: '' };
  const s = d.state;
  const icon = s === 1 ? '✅' : s === 2 ? '🔁' : '⬜';
  const cls = s === 1 ? 'have' : s === 2 ? 'repeated' : '';
  return `
    <div class="sticker ${cls}" id="stk-${cid}-${num}" onclick="cycleSticker('${cid}',${num})">
      <span class="sticker-badge">${s === 2 ? '×2' : ''}</span>
      <span class="sticker-num">#${num}</span>
      <span class="sticker-icon">${icon}</span>
      <span class="sticker-name" title="${d.name || ''}">${d.name || '---'}</span>
      <div class="sticker-actions" onclick="event.stopPropagation()">
        <button onclick="openModal('${cid}',${num})">✏️</button>
      </div>
    </div>`;
}

function updateStickerEl(cid, num) {
  const el = document.getElementById(`stk-${cid}-${num}`);
  if (!el) return;
  const d = albumData[cid]?.[num] ?? { state: 0, name: '' };
  const s = d.state;
  el.className = 'sticker ' + (s === 1 ? 'have' : s === 2 ? 'repeated' : '');
  el.querySelector('.sticker-icon').textContent = s === 1 ? '✅' : s === 2 ? '🔁' : '⬜';
  el.querySelector('.sticker-name').textContent = d.name || '---';
  const badge = el.querySelector('.sticker-badge');
  badge.textContent = s === 2 ? '×2' : '';
  badge.style.display = s === 2 ? 'flex' : 'none';
}

function updateCountryCard(cid) {
  const c = COUNTRIES.find(x => x.id === cid);
  const stats = getCountryStats(cid);
  const pct = Math.round((stats.have / STICKERS_PER) * 100);
  const card = document.getElementById('cc-' + cid);
  if (!card) return;
  card.classList.toggle('complete', stats.have === STICKERS_PER);
  const sub = card.querySelector('.c-sub');
  if (sub) sub.textContent = `Grupo ${c.group} · ${stats.have}/${STICKERS_PER}${stats.repeated > 0 ? ' · ' + stats.repeated + ' rep.' : ''}`;
  const bar = card.querySelector('.mini-bar');
  if (bar) bar.style.width = pct + '%';
  const cnt = card.querySelector('.c-count');
  if (cnt) cnt.textContent = pct + '%';
}

// ===== INTERACTIONS =====
window.cycleSticker = async function(cid, num) {
  const d = albumData[cid][num];
  d.state = (d.state + 1) % 3;
  updateStickerEl(cid, num);
  updateCountryCard(cid);
  updateStats();
  const labels = ['Quitada ❌', 'Agregada ✅', 'Repetida 🔁'];
  showToast(`#${num} ${COUNTRIES.find(c=>c.id===cid)?.name}: ${labels[d.state]}`);
  await saveSticker(cid, num);
};

window.toggleCountry = function(cid) {
  document.getElementById('cc-' + cid)?.classList.toggle('open');
};

// ===== MODAL =====
window.openModal = function(cid, num) {
  editTarget = { cid, num };
  const c = COUNTRIES.find(x => x.id === cid);
  document.getElementById('modalCountry').textContent = c?.name || cid;
  document.getElementById('modalNum').textContent = num;
  document.getElementById('modalInput').value = albumData[cid][num]?.name || '';
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => document.getElementById('modalInput').focus(), 100);
};
window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('show');
  editTarget = null;
};
window.saveName = async function() {
  if (!editTarget) return;
  const { cid, num } = editTarget;
  const val = document.getElementById('modalInput').value.trim();
  albumData[cid][num].name = val;
  updateStickerEl(cid, num);
  closeModal();
  showToast(`Nombre guardado: ${val || '(vacío)'}`);
  await saveSticker(cid, num);
};

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('modalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveName();
  if (e.key === 'Escape') closeModal();
});

// ===== SEARCH & FILTER =====
let activeFilterLocal = 'all';
document.getElementById('searchInput').addEventListener('input', function() {
  applyFilter();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilterLocal = this.dataset.filter;
    applyFilter();
  });
});

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  COUNTRIES.forEach(c => {
    const card = document.getElementById('cc-' + c.id);
    if (!card) return;
    const stats = getCountryStats(c.id);
    let searchMatch = !q || c.name.toLowerCase().includes(q);
    if (!searchMatch && q) {
      for (let i = 1; i <= STICKERS_PER; i++) {
        if ((albumData[c.id]?.[i]?.name || '').toLowerCase().includes(q)) {
          searchMatch = true; break;
        }
      }
    }
    let catMatch = true;
    if (activeFilterLocal === 'complete') catMatch = stats.have === STICKERS_PER;
    else if (activeFilterLocal === 'incomplete') catMatch = stats.have < STICKERS_PER;
    else if (activeFilterLocal === 'started') catMatch = stats.have > 0 && stats.have < STICKERS_PER;
    card.classList.toggle('hidden', !searchMatch || !catMatch);
    if (q && searchMatch && !c.name.toLowerCase().includes(q)) card.classList.add('open');
  });
}

// ===== EXPORT/IMPORT =====
window.exportData = function() {
  const blob = new Blob([JSON.stringify({ version: 2, firebase: true, data: albumData, exported: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `album_mundial_2026_backup_${new Date().toLocaleDateString('es').replace(/\//g,'-')}.json`;
  a.click();
  showToast('💾 Backup exportado');
};
window.importData = function() { document.getElementById('fileInput').click(); };
window.loadFile = async function(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async function(ev) {
    try {
      const parsed = JSON.parse(ev.target.result);
      albumData = parsed.data || parsed;
      ensureData();
      await set(ref(db, 'album'), albumData);
      renderAll();
      showToast('📂 Datos importados y guardados en Firebase');
    } catch { showToast('❌ Error al importar'); }
  };
  r.readAsText(file);
  e.target.value = '';
};

// ===== TOAST =====
let toastTimer;
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
};

// ===== START =====
loadFromFirebase();
</script>
</body>
</html>
