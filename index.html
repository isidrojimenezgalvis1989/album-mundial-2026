<style>
  :root {
    --gold: #FFD700; --gold2: #FFA500; --dark: #0a0a1a; --card: #13132a;
    --card2: #1a1a35; --green: #00e676; --red: #ff1744; --blue: #2979ff;
    --orange: #FF6D00; --text: #e8e8f0; --muted: #8888aa; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark); color: var(--text);
    font-family: 'Nunito', sans-serif; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(255,215,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(41,121,255,0.08) 0%, transparent 60%);
  }
  header {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a35 50%, #0a0a1a 100%);
    border-bottom: 3px solid var(--gold); padding: 14px 20px 10px;
    text-align: center; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 30px rgba(255,215,0,0.15);
  }
  header h1 {
    font-family: 'Bebas Neue', cursive; font-size: clamp(1.6rem, 5vw, 2.8rem);
    background: linear-gradient(90deg, var(--gold), #fff, var(--gold2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px; line-height: 1;
  }
  .sync-status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.72rem; margin-top: 4px; padding: 3px 10px;
    border-radius: 999px; background: rgba(0,230,118,0.1);
    border: 1px solid rgba(0,230,118,0.2); color: var(--green);
  }
  .sync-status.offline { background: rgba(255,23,68,0.1); border-color: rgba(255,23,68,0.2); color: var(--red); }
  .sync-status.syncing { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.2); color: var(--gold); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .stats-bar {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    padding: 12px 16px; background: var(--card);
    border-bottom: 1px solid rgba(255,215,0,0.12);
  }
  .stat-pill {
    background: var(--card2); border: 1px solid rgba(255,215,0,0.2);
    border-radius: 999px; padding: 5px 14px; font-size: 0.8rem;
    display: flex; align-items: center; gap: 5px;
  }
  .stat-pill span { font-weight: 900; font-size: 0.95rem; }
  .s-total { color: var(--gold); } .s-have { color: var(--green); }
  .s-miss { color: var(--red); } .s-rep { color: var(--orange); } .s-pct { color: var(--blue); }
  .controls {
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px;
    background: var(--dark); border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--card); border: 1.5px solid rgba(255,215,0,0.25);
    border-radius: 999px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; padding: 9px 16px 9px 38px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.5; }
  .filter-btn {
    background: var(--card); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 999px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 0.8rem; font-weight: 700; padding: 7px 14px; cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

  /* GRUPOS */
  .group-section { margin: 0; }
  .group-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: rgba(255,215,0,0.06);
    border-top: 2px solid rgba(255,215,0,0.2);
    border-bottom: 1px solid rgba(255,215,0,0.1);
    position: sticky; top: 88px; z-index: 50;
  }
  .group-badge {
    font-family: 'Bebas Neue'; font-size: 1.4rem; color: var(--gold);
    background: rgba(255,215,0,0.12); border: 2px solid var(--gold);
    border-radius: 8px; padding: 2px 12px; min-width: 52px; text-align: center;
  }
  .group-title { font-size: 0.85rem; color: var(--muted); }
  .group-title strong { color: var(--text); font-size: 0.9rem; }
  .group-stats { margin-left: auto; font-size: 0.78rem; color: var(--muted); }

  .countries {
    padding: 12px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px;
  }
  .country-card {
    background: var(--card); border-radius: var(--radius);
    border: 1.5px solid rgba(255,255,255,0.07); overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .country-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .country-card.complete { border-color: rgba(0,230,118,0.4); }
  .country-card.hidden { display: none; }
  .country-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 13px; background: var(--card2); cursor: pointer; user-select: none;
  }
  .country-header:hover { background: rgba(255,215,0,0.06); }
  .country-left { display: flex; align-items: center; gap: 9px; }
  .country-flag { font-size: 1.5rem; line-height: 1; }
  .country-info h3 { font-size: 0.9rem; font-weight: 900; letter-spacing: 0.5px; }
  .country-info .c-sub { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
  .country-right { display: flex; align-items: center; gap: 7px; }
  .mini-bar-wrap { width: 55px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .mini-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), #00bcd4); transition: width 0.5s; }
  .c-count { font-size: 0.75rem; font-weight: 700; color: var(--gold); min-width: 32px; text-align: right; }
  .toggle-arrow { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
  .country-card.open .toggle-arrow { transform: rotate(180deg); }

  /* STICKERS */
  .stickers-panel {
    display: none; padding: 10px;
    grid-template-columns: repeat(5, 1fr); gap: 7px;
  }
  .country-card.open .stickers-panel { display: grid; }
  .sticker {
    background: var(--card2); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 9px; padding: 7px 3px; text-align: center; cursor: pointer;
    transition: all 0.15s; position: relative; min-height: 78px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .sticker:hover { transform: scale(1.06); border-color: var(--gold); }
  .sticker.have { background: rgba(0,230,118,0.12); border-color: rgba(0,230,118,0.5); }
  .sticker.repeated { background: rgba(255,109,0,0.12); border-color: rgba(255,109,0,0.5); }
  .sticker-num { font-size: 0.62rem; color: var(--muted); font-weight: 700; }
  .sticker-name {
    font-size: 0.55rem; color: var(--text); font-weight: 600;
    line-height: 1.2; text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sticker-icon { font-size: 1rem; }
  .rep-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--orange); color: #fff;
    border-radius: 999px; font-size: 0.5rem; font-weight: 900;
    min-width: 18px; height: 18px; display: none;
    align-items: center; justify-content: center;
    border: 2px solid var(--dark);
  }
  .sticker.repeated .rep-badge { display: flex; }
  .sticker-actions {
    display: flex; gap: 3px; margin-top: 2px;
  }
  .sticker-actions button {
    background: transparent; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px; color: var(--muted); font-size: 0.55rem;
    padding: 2px 4px; cursor: pointer; transition: all 0.15s;
    font-family: 'Nunito'; font-weight: 700;
  }
  .sticker-actions button:hover { background: rgba(255,215,0,0.15); color: var(--gold); }

  /* LEGEND */
  .legend {
    display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px;
    font-size: 0.73rem; color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.05);
    background: var(--dark);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 4px; }
  .ld-have { background: rgba(0,230,118,0.5); border: 1px solid var(--green); }
  .ld-rep { background: rgba(255,109,0,0.5); border: 1px solid var(--orange); }
  .ld-miss { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); }

  /* MODAL NOMBRE */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 2px solid var(--gold); border-radius: 18px;
    padding: 22px 20px; width: 92%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);

  .modal h3 { font-family: 'Bebas Neue'; font-size: 1.3rem; color: var(--gold); margin-bottom: 12px; }
  .modal label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal input, .modal select {
    width: 100%; background: var(--card2); border: 1.5px solid rgba(255,215,0,0.3);
    border-radius: 10px; color: var(--text); font-family: 'Nunito'; font-size: 0.9rem;

  .modal input:focus, .modal select:focus { border-color: var(--gold); }
  .modal select option { background: var(--card2); }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; padding: 10px; border-radius: 10px; border: none;
    font-family: 'Nunito'; font-weight: 900; font-size: 0.9rem; cursor: pointer;

  .btn-save { background: var(--gold); color: #000; }
  .btn-cancel { background: var(--card2); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--gold); border-radius: 999px;
    padding: 10px 20px; font-size: 0.85rem; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 300; opacity: 0;
    transition: opacity 0.3s; white-space: nowrap; pointer-events: none;

  .toast.show { opacity: 1; }

  /* LOADING */
  .loading-screen {
    position: fixed; inset: 0; background: var(--dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 500; gap: 16px;
  }
  .loading-screen h2 { font-family: 'Bebas Neue'; font-size: 2rem; color: var(--gold); }
  .loading-screen p { color: var(--muted); font-size: 0.9rem; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,215,0,0.2);
    border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .export-bar {
    padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,215,0,0.12); background: var(--card);
  }
  .export-bar button {
    background: var(--card2); border: 1.5px solid rgba(255,215,0,0.25);
    border-radius: 999px; color: var(--text); font-family: 'Nunito'; font-weight: 700;
    font-size: 0.8rem; padding: 8px 16px; cursor: pointer; transition: all 0.2s;

  .export-bar button:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  .group-section.hidden-group { display: none; }

  @media (max-width: 480px) {
    .countries { grid-template-columns: 1fr; padding: 10px; }
    .stickers-panel { grid-template-columns: repeat(4, 1fr); }
    .group-header { top: 76px; }
  }
</style>

function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + state;
  document.getElementById('syncText').textContent = text;
}

function initEmpty() {
  albumData = {};
  GROUPS.forEach(g => g.countries.forEach(c => {
    albumData[c.id] = {};
    for (let i = 1; i <= STICKERS_PER; i++)
      albumData[c.id][i] = { state: 0, name: '', qty: 0 };
  }));
}

function ensureData() {
  GROUPS.forEach(g => g.countries.forEach(c => {
    if (!albumData[c.id]) albumData[c.id] = {};
    for (let i = 1; i <= STICKERS_PER; i++) {
      if (!albumData[c.id][i]) albumData[c.id][i] = { state: 0, name: '', qty: 0 };
      if (albumData[c.id][i].qty === undefined) albumData[c.id][i].qty = albumData[c.id][i].state === 2 ? 2 : albumData[c.id][i].state;
    }
  }));
}

async function loadFromFirebase() {
  try {
    const snap = await get(ref(db, 'album'));
    if (snap.exists()) { albumData = snap.val(); ensureData(); }
    else { initEmpty(); await set(ref(db, 'album'), albumData); }
    setSyncStatus('online', '🔥 Firebase conectado');
    document.getElementById('loadingScreen').style.display = 'none';
    renderAll();
    onValue(ref(db, 'album'), (s) => {
      if (s.exists()) { albumData = s.val(); ensureData(); refreshStats(); refreshAllCards(); }
    });
  } catch(e) {
    setSyncStatus('offline', '❌ Sin conexión');
    document.getElementById('loadingScreen').style.display = 'none';
    initEmpty(); renderAll();
    showToast('⚠️ Sin conexión. Datos no guardados.');
  }
}

async function saveSticker(cid, num) {
  try {
    setSyncStatus('syncing', '⏳ Guardando...');
    await set(ref(db, `album/${cid}/${num}`), albumData[cid][num]);
    setSyncStatus('online', '✅ Guardado');
  } catch(e) { setSyncStatus('offline', '❌ Error al guardar'); }
}

function getCountryStats(cid) {
  let have = 0, repeated = 0, repTotal = 0;
  for (let i = 1; i <= STICKERS_PER; i++) {
    const d = albumData[cid]?.[i] ?? {};
    const qty = d.qty ?? 0;
    if (qty >= 1) have++;
    if (qty >= 2) { repeated++; repTotal += qty - 1; }
  }
  return { have, repeated, repTotal };
}

function updateStats() {
  let have = 0, repTotal = 0;
  const total = GROUPS.reduce((a, g) => a + g.countries.length, 0) * STICKERS_PER;
  GROUPS.forEach(g => g.countries.forEach(c => {
    const s = getCountryStats(c.id);
    have += s.have; repTotal += s.repTotal;
  }));
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sHave').textContent = have;
  document.getElementById('sMiss').textContent = total - have;
  document.getElementById('sRep').textContent = repTotal;
  document.getElementById('sPct').textContent = Math.round((have / total) * 100) + '%';
}

function renderAll() {
  const content = document.getElementById('mainContent');
  content.innerHTML = GROUPS.map(renderGroup).join('');
  updateStats();
  applyFilter();
}

function renderGroup(g) {
  const allHave = g.countries.reduce((a, c) => a + getCountryStats(c.id).have, 0);
  const total = g.countries.length * STICKERS_PER;
  return `
    <div class="group-section" id="gs-${g.id}">
      <div class="group-header">
        <div class="group-badge">GRP ${g.id}</div>
        <div>
          <div class="group-title"><strong>${g.countries.map(c=>c.name).join(' · ')}</strong></div>
        </div>
        <div class="group-stats">${allHave}/${total}</div>
      </div>
      <div class="countries">${g.countries.map(c => renderCountry(c, g.id)).join('')}</div>
    </div>`;
}

function renderCountry(c, gid) {
  const stats = getCountryStats(c.id);
  const pct = Math.round((stats.have / STICKERS_PER) * 100);
  const isComplete = stats.have === STICKERS_PER;
  let stk = '';
  for (let i = 1; i <= STICKERS_PER; i++) stk += renderSticker(c.id, i);
  return `
    <div class="country-card ${isComplete ? 'complete' : ''}" id="cc-${c.id}">
      <div class="country-header" onclick="toggleCountry('${c.id}')">
        <div class="country-left">
          <span class="country-flag">${c.flag}</span>
          <div class="country-info">
            <h3>${c.name}</h3>
            <div class="c-sub">${stats.have}/${STICKERS_PER} láminas${stats.repTotal > 0 ? ' · ' + stats.repTotal + ' sobrantes' : ''}</div>
          </div>
        </div>
        <div class="country-right">
          <div class="mini-bar-wrap"><div class="mini-bar" style="width:${pct}%"></div></div>
          <div class="c-count">${pct}%</div>
          <span class="toggle-arrow">▼</span>
        </div>
      </div>
      <div class="stickers-panel" id="sp-${c.id}">${stk}</div>
    </div>`;
}

function renderSticker(cid, num) {
  const d = albumData[cid]?.[num] ?? { state: 0, name: '', qty: 0 };
  const qty = d.qty ?? 0;
  const icon = qty === 0 ? '⬜' : qty === 1 ? '✅' : '🔁';
  const cls = qty === 0 ? '' : qty === 1 ? 'have' : 'repeated';
  const badge = qty >= 2 ? `×${qty}` : '';
  return `
    <div class="sticker ${cls}" id="stk-${cid}-${num}" onclick="cycleSticker('${cid}',${num})">
      <span class="rep-badge">${badge}</span>
      <span class="sticker-num">#${num}</span>
      <span class="sticker-icon">${icon}</span>
      <span class="sticker-name" title="${d.name||''}">${d.name||'---'}</span>
      <div class="sticker-actions" onclick="event.stopPropagation()">
        <button onclick="openModal('${cid}',${num})" title="Editar">✏️</button>
      </div>
    </div>`;
}

function updateStickerEl(cid, num) {
  const el = document.getElementById(`stk-${cid}-${num}`);
  if (!el) return;
  const d = albumData[cid]?.[num] ?? { qty: 0, name: '' };
  const qty = d.qty ?? 0;
  el.className = 'sticker ' + (qty === 0 ? '' : qty === 1 ? 'have' : 'repeated');
  el.querySelector('.sticker-icon').textContent = qty === 0 ? '⬜' : qty === 1 ? '✅' : '🔁';
  el.querySelector('.sticker-name').textContent = d.name || '---';
  const badge = el.querySelector('.rep-badge');
  badge.textContent = qty >= 2 ? `×${qty}` : '';
  badge.style.display = qty >= 2 ? 'flex' : 'none';
}

function updateCountryCard(cid) {
  const c = GROUPS.flatMap(g=>g.countries).find(x=>x.id===cid);
  if (!c) return;
  const stats = getCountryStats(cid);
  const pct = Math.round((stats.have / STICKERS_PER) * 100);
  const card = document.getElementById('cc-' + cid);
  if (!card) return;
  card.classList.toggle('complete', stats.have === STICKERS_PER);
  const sub = card.querySelector('.c-sub');
  if (sub) sub.textContent = `${stats.have}/${STICKERS_PER} láminas${stats.repTotal > 0 ? ' · ' + stats.repTotal + ' sobrantes' : ''}`;
  const bar = card.querySelector('.mini-bar');
  if (bar) bar.style.width = pct + '%';
  const cnt = card.querySelector('.c-count');
  if (cnt) cnt.textContent = pct + '%';
}

function refreshStats() { updateStats(); }
function refreshAllCards() {
  GROUPS.forEach(g => g.countries.forEach(c => {
    updateCountryCard(c.id);
    for (let i = 1; i <= STICKERS_PER; i++) updateStickerEl(c.id, i);
  }));
}

window.cycleSticker = async function(cid, num) {
  const d = albumData[cid][num];
  const qty = d.qty ?? 0;
  // Ciclo: 0 → 1 → 0
  d.qty = qty === 0 ? 1 : 0;
  d.state = d.qty >= 2 ? 2 : d.qty === 1 ? 1 : 0;
  updateStickerEl(cid, num);
  updateCountryCard(cid);
  updateStats();
  const label = d.qty === 1 ? 'Agregada ✅' : 'Quitada ❌';
  showToast(`#${num}: ${label} — usa ✏️ para marcar repetidas`);
  await saveSticker(cid, num);
};

window.toggleCountry = function(cid) {
  document.getElementById('cc-'+cid)?.classList.toggle('open');
};

window.openModal = function(cid, num) {
  editTarget = { cid, num };
  const c = GROUPS.flatMap(g=>g.countries).find(x=>x.id===cid);
  document.getElementById('modalCountry').textContent = c?.name || cid;
  document.getElementById('modalNum').textContent = num;
  const d = albumData[cid][num];
  document.getElementById('modalInput').value = d.name || '';
  document.getElementById('modalRep').value = String(d.qty ?? 0);
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => document.getElementById('modalInput').focus(), 100);
};
window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('show');
  editTarget = null;
};
window.saveName = async function() {
  if (!editTarget) return;
  const { cid, num } = editTarget;
  const name = document.getElementById('modalInput').value.trim();
  const qty = parseInt(document.getElementById('modalRep').value);
  albumData[cid][num].name = name;
  albumData[cid][num].qty = qty;
  albumData[cid][num].state = qty >= 2 ? 2 : qty === 1 ? 1 : 0;
  updateStickerEl(cid, num);
  updateCountryCard(cid);
  updateStats();
  closeModal();
  showToast(`Lámina #${num} guardada: ${name || '(sin nombre)'} ×${qty}`);
  await saveSticker(cid, num);
};

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('modalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveName();
  if (e.key === 'Escape') closeModal();
});

document.getElementById('searchInput').addEventListener('input', applyFilter);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.filter;
    applyFilter();
  });
});

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  GROUPS.forEach(g => {
    let groupVisible = false;
    g.countries.forEach(c => {
      const card = document.getElementById('cc-'+c.id);
      if (!card) return;
      const stats = getCountryStats(c.id);
      let sm = !q || c.name.toLowerCase().includes(q);
      if (!sm && q) {
        for (let i = 1; i <= STICKERS_PER; i++) {
          if ((albumData[c.id]?.[i]?.name||'').toLowerCase().includes(q)) { sm = true; break; }
        }
      }
      let cm = true;
      if (activeFilter === 'complete') cm = stats.have === STICKERS_PER;
      else if (activeFilter === 'incomplete') cm = stats.have < STICKERS_PER;
      else if (activeFilter === 'started') cm = stats.have > 0 && stats.have < STICKERS_PER;
      const visible = sm && cm;
      card.classList.toggle('hidden', !visible);
      if (visible) groupVisible = true;
      if (q && sm && !c.name.toLowerCase().includes(q)) card.classList.add('open');
    });
    const gs = document.getElementById('gs-'+g.id);
    if (gs) gs.classList.toggle('hidden-group', !groupVisible);
  });
}

window.exportData = function() {
  const blob = new Blob([JSON.stringify({ version: 3, data: albumData, exported: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `album_mundial_2026_${new Date().toLocaleDateString('es').replace(/\//g,'-')}.json`;
  a.click();
  showToast('💾 Backup exportado');
};
window.importData = function() { document.getElementById('fileInput').click(); };
window.loadFile = async function(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async function(ev) {
    try {
      const p = JSON.parse(ev.target.result);
      albumData = p.data || p;
      ensureData();
      await set(ref(db, 'album'), albumData);
      renderAll();
      showToast('📂 Datos importados y guardados en Firebase');
    } catch { showToast('❌ Error al importar'); }
  };
  r.readAsText(file); e.target.value = '';
};

let toastTimer;
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

loadFromFirebase();
</script>
</body>
